slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames and topic exported by the Ackermann Gazebo model.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    scan_queue_size: 1
    throttle_scans: 1
    minimum_time_interval: 0.1
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 8.0
