# Read by map.launch.py; this is not a ROS --params-file.
# Robot: wall clock, EKF publishes odom -> base_link; GUI runs on the PC.
launch:
  use_sim_time: false
  start_cv: false
  cv_config: cv_real.yaml  # Profile identity is independent of the clock.
  start_slam: true
  start_mapper: true
  start_rviz: false
  start_gui: false
  rviz_config: offline_map.rviz  # Relative to limo_rviz/config, or an absolute path.
  fixed_frame: map

slam_toolbox:
  odom_frame: odom
  map_frame: map
  base_frame: base_link
  scan_topic: /scan
  mode: mapping
  transform_timeout: 0.2
  tf_buffer_duration: 30.0
  scan_queue_size: 1
  throttle_scans: 1
  minimum_time_interval: 0.1
  # Slow manual mapping: accept movement of one map cell or ~3 degrees.
  minimum_travel_distance: 0.05
  minimum_travel_heading: 0.05
  # Publish new laser geometry twice per second; semantic output stays at 4 Hz.
  map_update_interval: 0.5
  resolution: 0.05
  max_laser_range: 8.0

semantic_mapper:
  cloud_topic: /limo/cv_package/visual_ptcld/points
  # Complete laser layer from SLAM; each update replaces the previous map.
  reference_map_topic: /map
  map_frame: map
  odom_frame: odom
  pose_source: tf
  submap_topic: /submap_list
  trajectory_id: 0
  resolution: 0.05
  # Fixed costs: exterior/interior road = 0, lidar = 100.
  turquoise_cost: 60
  white_cost: 30
  boardwalk_cost: 90
  hit_log_odds: 0.85
  miss_log_odds: 0.4
  # Low camera FPS: switch a saturated class after 2 consistent pure-class
  # observations instead of 5. Clearing to road has extra protection below.
  log_odds_limit: 1.0
  min_evidence: 0.5
  # Require this many consecutive road-majority observations of an occupied
  # cell before starting to reduce its evidence. 1 disables the extra delay.
  free_confirmations: 4
  publish_rate_hz: 4.0
  save_directory: ''  # ros2_maps/semantic in the workspace running the mapper.
  save_map_name: limo_map
  # Filter the CV snapshot only when saving; live evidence and laser are unchanged.
  save_median_kernel: 3  # Odd kernel: 1 disables, 5 removes larger speckles.
  tf_wait_sec: 0.5
  submap_max_age_sec: 2.0
  max_input_points: 100000
  max_cells: 2000000
  max_output_cells: 4000000

map_save_gui:
  save_service: /limo/map_package/offline/map_saver/save_map
  status_topic: /limo/map_package/offline/map_saver/status
