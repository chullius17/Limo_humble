# Read by cv.launch.py; this is not a ROS --params-file.
launch:
  lane_detector: waterfall
  use_sim_time: false
  start_rviz: false
  rviz_config: cv_visual.rviz

lane_detector:
  enable_telemetry: false
  rgb_topic: /rgb/image_raw
  # Seeded growth bounded by scaled Sobel gradients.
  seed_max_gray: 80
  gradient_threshold: 15.0
  seed_y_min: 0.0
  seed_erosion_iterations: 0
  barrier_dilation_iterations: 1
  debug_jpeg_quality: 85
  debug_probe_interval_frames: 30
  roi_y_min: 0.1
  roi_y_max: 1.0
  opencv_num_threads: 1

depth_correction:
  input_topic: /depth_camera/depth/image_raw
  camera_info_topic: /depth_camera/depth/camera_info
  enable_telemetry: false

visual_ptcld:
  # Keep road (1, 5) and boardwalk (4, 6); discard yellow/background.
  road_boardwalk_only: true
  opencv_num_threads: 1
  enable_telemetry: true
  roi_y_min: 0.0
  roi_y_max: 1.0
  enable_debug_publications: false
  point_voxel_size: 5
  pointcloud_voxel_size_m: 0.02
  blue_boundary_kernel_size: 7
  camera_info_topic: /rgb/camera_info
  depth_topic: limo/cv_package/depth_correction/depth_corrected/raw
  fallback_depth_topic: /depth_camera/depth/image_raw
  corrected_depth_timeout_sec: 1.0
  fallback_depth_width: 320
  fallback_depth_height: 120
  pointcloud_topic: limo/cv_package/visual_ptcld/points
  input_crop_y_min: 0.5
  pointcloud_min_depth_m: 0.1
  pointcloud_max_depth_m: 2.5
  blue_radius_min_m: 0.04
  blue_radius_max_m: 0.25
  enable_boardwalk: true
  boardwalk_propagation_radius_m: 0.15
  telemetry_window_size: 60
  telemetry_log_interval_frames: 30
