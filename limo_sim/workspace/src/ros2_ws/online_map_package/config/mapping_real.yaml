# Read by online_map.launch.py; this is not a ROS --params-file.
# Robot: wall clock and headless localization; CV/sensors already run onboard.
launch:
  use_sim_time: false
  start_cv: false
  start_maps: true
  start_amcl: true
  start_local_ctrl_map: true
  start_rviz: false
  rviz_config: online_map.rviz  # Used by desktop_online.launch.py on the PC.
  fixed_frame: map

map_servers:
  directory: ''  # ros2_maps/semantic in the workspace running the backend.
  name: limo_map
  frame_id: map
  complete_topic: /map
  laser_topic: /limo/map_package/online/maps/laser_map
  cv_obstacle_topic: /limo/map_package/online/maps/cv_obstacle

local_ctrl_map:
  output_cloud_topic: /limo/map_package/online/local_ctrl_map/points
  inner_trapezoid_inset: 0.20  # Inset of near and sloped edges; front stays aligned.
  maximum_points: 300  # Highest-confidence persistent points across classes 2/4.
  minimum_confidence: 0.30
  confidence_decay_per_sec: 0.10
  yellow_decay_multiplier: 3.0
  cmd_vel_topic: /cmd_vel
  linear_speed_at_max_decay: 0.50
  angular_speed_at_max_decay: 1.00
  linear_stationary_threshold: 0.01
  angular_stationary_threshold: 0.02
  cmd_vel_timeout_sec: 0.0
  voxel_size: 0.03
  grid_resolution: 0.02
  # Keep this source grid raw; the controller costmap performs the only inflation.
  inflation_radius: 0.0
  grid_publish_rate: 10.0
  live_cloud_timeout_sec: 0.50
  tf_wait_timeout_sec: 0.20  # Bounded non-blocking wait for exact cloud TF.
  max_pending_clouds: 10
  yellow_line_cost: 60
  soft_obstacle_cost: 30
  boardwalk_cost: 90

amcl:
  base_frame_id: base_link
  odom_frame_id: odom
  global_frame_id: map
  scan_topic: /scan
  tf_broadcast: true
  cv_enabled: true
  cv_cloud_topic: /limo/cv_package/visual_ptcld/points
  cv_buffer_size: 10
  cv_sync_tolerance: 0.20
  cv_voxel_size: 0.075
  cv_min_points: 5.0
  # Ignore CV localization updates without enough independent non-road evidence.
  cv_min_non_road_voxels: 20
  cv_occupied_threshold: 50
  # Equal laser/CV factors; unusable CV leaves the laser update intact.
  laser_weight_factor: 1.0
  cv_weight_factor: 1.0
  cv_sad_gain: 20.0
  cv_quality_gate_enabled: true
  cv_min_information: 0.02
  cv_max_position_stddev: 0.5
  cv_max_yaw_stddev: 0.5
  max_particles: 800
  min_particles: 300
  workload_logging_enabled: true
  alpha1: 0.2
  alpha2: 0.2
  alpha3: 0.2
  alpha4: 0.2
