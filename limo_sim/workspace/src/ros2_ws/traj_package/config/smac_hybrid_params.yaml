# SMAC Hybrid-A* profile for ROS 2 Humble.
#
# Profile assumptions:
# - LIMO operating in Ackermann mode;
# - costmap resolution of 0.05 m/cell;
# - controller speed range from -0.10 m/s to 0.50 m/s;
# - execution alongside the CV pipeline on a Jetson Nano.
#
# use_sim_time is a false placeholder rewritten by the launch file for either
# simulation or the real robot.

planner_server:
  ros__parameters:
    use_sim_time: false

    # Nav2 uses this frequency to report slow planning; it does not make the
    # Behavior Tree replan at 1 Hz by itself. Since the LIMO moves slowly, there
    # is no benefit in expecting 20 global plans per second.
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      # Foxy's SE2 SMAC plugin implements Hybrid A* with Dubins primitives.
      plugin: "smac_planner/SmacPlanner"

      # Keep the map at 5 cm: at 10 cm, the small LIMO footprint and narrow
      # passages would be represented by too few cells.
      downsample_costmap: false
      downsampling_factor: 1

      # The controller considers the goal reached within 0.15 m. Using the same
      # tolerance avoids spending search effort on accuracy that the path
      # follower would not require.
      tolerance: 0.15

      # The combined map explicitly distinguishes known and unknown cells. For
      # safety, the planner must not traverse areas that were never mapped.
      allow_unknown: false

      # Longer routes need a larger Hybrid-A* search budget. Planning is an
      # occasional workload, so 7.5 seconds and 750k iterations are accepted
      # while retaining finite limits for pathological searches on the Nano.
      max_iterations: 750000
      max_on_approach_iterations: 1000
      max_planning_time: 7.5

      # Dubins paths preserve the Ackermann turning-radius constraint and only
      # permit forward motion, so the planned path contains no reversals.
      motion_model_for_search: "DUBIN"

      # 64 headings correspond to 5.625 degrees per bin: sufficient accuracy for
      # a 5 cm grid, with fewer states than the default 72-bin configuration.
      angle_quantization_bins: 64

      # Analytic expansion accelerates the final approach. The longer limit
      # allows direct Dubins connections from farther away while retaining the
      # normal Hybrid-A* collision checks.
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 7.5

      # The theoretical centre-line limit is 0.462 m. Use a conservative
      # operational radius so every planned primitive remains comfortably
      # inside the steering capability of the physical robot.
      minimum_turning_radius: 0.7

      change_penalty: 0.0
      non_straight_penalty: 1.15
      # Preserve cells up to 85 as traversable, but make semantic costs above
      # 25 increasingly unattractive. A strong cost weight makes SMAC prefer a
      # longer low-cost detour while still allowing the 26-85 band when it is
      # the only feasible route. Values >= 86 are made lethal by StaticLayer.
      cost_penalty: 4.0

      # A 15 m lookup window gives the non-holonomic heuristic useful coverage
      # on longer routes without returning to the generic 20 m memory cost.
      lookup_table_size: 15.0

      # The CV and lidar layers make the map dynamic. Do not cache the obstacle
      # heuristic across replanning requests, because its costs could become stale.
      cache_obstacle_heuristic: false

      # Preserve the curvature of the kinematically feasible Hybrid-A* path.
      # Geometric smoothing is disabled so it cannot tighten bends afterward.
      smooth_path: false
      smoother:
        max_iterations: 500
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-4

# SMAC plans against this Costmap2D instance. The online node already merges
# the static map, CV observations, and lidar endpoints, so another obstacle
# plugin here would duplicate sensor processing.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.3

      # Keep the source-map geometry and resolution. The map topic itself is
      # remapped by trajectory.launch.py for Foxy/Humble portability.
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      # RViz Foxy repeats the first update row across every row when applying
      # OccupancyGridUpdate, producing stripes after the first good frame.
      # Publish complete grids to bypass that bug (about 38 kB at 1 Hz here).
      always_send_full_costmap: true

      # These are costmap-wide StaticLayer inputs in Foxy/Humble. Keeping
      # trinary mode disabled preserves intermediate OccupancyGrid costs.
      trinary_costmap: false
      # Source-map values strictly greater than 85 are hard obstacles for
      # SMAC. StaticLayer treats values >= this threshold as lethal.
      lethal_cost_threshold: 86
      unknown_cost_value: 255
      use_maximum: false

      # Use the physical 0.322 x 0.220 m LIMO footprint, matching the local
      # controller costmap and the goal-validation footprint.
      footprint: "[[-0.161, -0.110], [-0.161, 0.110], [0.161, 0.110], [0.161, -0.110]]"
      footprint_padding: 0.0

      plugins: ["static_layer", "border_follow_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/limo/map_package/online/map/combined_grid"
        map_subscribe_transient_local: true
        subscribe_to_updates: false

      border_follow_layer:
        plugin: "limo_inflation::BorderFollowLayer"
        source_topic: "/limo/map_package/online/map/combined_grid"
        obstacle_threshold: 10
        robot_width: 0.220
        safety_margin: 0.05
        # The plugin derives the second preferred distance as 1.5 * robot_width
        # (0.33 m with the physical 0.220 m width).
        distance_tolerance: 0.02
        near_max_cost: 120
        # Strongly discourage crossing between the two preferred lanes while
        # keeping the ridge traversable when no lower-cost route exists.
        inter_lane_peak_cost: 100
        far_cost_slope: 10.0
        far_max_cost: 8
